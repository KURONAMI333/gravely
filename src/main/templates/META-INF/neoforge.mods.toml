# Gravely - mods.toml
modLoader="javafml"
loaderVersion="${loader_version_range}"

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="KURONAMI333"
displayURL="https://github.com/KURONAMI333/gravely"
issueTrackerURL="https://github.com/KURONAMI333/gravely/issues"
description='''
Gravely — A clean, lightweight grave mod with broad mod compatibility.
'''

# ─────────────────────────────────────────────────
# 必須依存
# ─────────────────────────────────────────────────
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ─────────────────────────────────────────────────
# オプション依存 (居れば自動連携)
# ─────────────────────────────────────────────────
# Curios: Curios slot 装備を墓に保管・回収 (BOTH)
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.0.0,)"
    ordering="AFTER"
    side="BOTH"

# JourneyMap: 墓位置を waypoint として登録 (CLIENT のみ)
# JM のバージョン形式は "1.21.1-6.0.0-beta.65" と複合 → 先頭の 1.21.1 が比較対象になるため
# 範囲は [0,) で広く取る (実装の API 互換性は ApotheosisCompat 側でガード)
[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

